<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FICSIT Monitor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M14 8 3 14l2-6-2-6z' fill='%23fa9549'/></svg>">
<style>
  :root {
    --bg: #14171c; --panel: #1c2027; --panel-2: #232831; --panel-3: #1f242c; --line: #2f3540;
    --text: #e6e8eb; --muted: #8c94a1; --accent: #fa9549; --accent-dim: #fa954933;
    --ok: #5fcf80; --warn: #f2c14e; --bad: #ef5f5f; --info: #5fa8ef; --driven: #c39cf7;
    --head1: 34px;
    --serious: #ec835a; --track: #2f3540;
    /* chart series (categorical slots 1-4, dark steps validated against --panel for CVD separation) */
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; }
  .stat b { font-size: 16px; margin-right: 4px; }
  .conn { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.bad { background: var(--bad); }

  .banner { margin: 12px 20px 0; padding: 8px 12px; border-radius: 6px; font-size: 13px;
            background: #f2c14e1a; border: 1px solid #f2c14e55; color: var(--warn); display: none; }
  main { padding: 12px 20px 20px; }

  /* table with sort row + filter row in the sticky header */
  .table-wrap { overflow: auto; max-height: 52vh; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
  table.fixed { table-layout: fixed; }
  th, td { padding: 7px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
  /* fixed row height (resizable): text wraps inside the row and is clamped to the lines that fit;
     cargo stays on one line until its row is clicked open, which lets that row grow */
  #tbody td { height: var(--row-h, 60px); vertical-align: middle; padding-top: 5px; padding-bottom: 5px; }
  td .cell { white-space: normal; overflow-wrap: anywhere; overflow: hidden;
             display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--row-lines, 2); }
  td.num .cell, td .pill, td .type { white-space: nowrap; }
  td .pill + .muted { font-size: 12px; }
  td.cargo .cell { display: block; white-space: nowrap; text-overflow: ellipsis; }
  td.vid .cell { -webkit-line-clamp: unset; display: block; line-height: 1.3; }
  td.vid .sub { font-size: 12px; line-height: 15px; display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }
  tr.cargo-open td.cargo .cell { white-space: normal; -webkit-line-clamp: unset; }
  table.measuring td .cell { display: block; white-space: nowrap; }
  #tbody td:first-child { position: relative; }
  .rh { position: absolute; left: 0; right: 0; bottom: -4px; height: 8px; cursor: row-resize; z-index: 1; }
  .rh:hover, .rh.dragging { background: linear-gradient(transparent 3px, var(--accent) 3px, var(--accent) 5px, transparent 5px); }
  body.row-resizing, body.row-resizing * { cursor: row-resize !important; user-select: none !important; }
  .cargo-pop { position: fixed; z-index: 30; min-width: 180px; max-width: 360px; padding: 6px 4px; border-radius: 8px;
               background: var(--panel-2); border: 1px solid var(--line); box-shadow: 0 10px 30px #000a;
               pointer-events: none; display: none; font-size: 13px; }
  .cargo-pop .row { display: flex; justify-content: space-between; gap: 16px; padding: 3px 9px; }
  .cargo-pop .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .cargo-pop .head { padding: 2px 9px 6px; margin-bottom: 3px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  tr.cargo-open td.cargo { color: var(--text); box-shadow: inset 2px 0 0 #fa954980; }
  tr.sort-row th { overflow: hidden; text-overflow: ellipsis; }
  .rz { position: absolute; top: 0; right: 0; width: 7px; height: 100%; cursor: col-resize; z-index: 3; }
  .rz::after { content: ""; position: absolute; top: 8px; bottom: 8px; right: 3px; width: 1px; background: var(--line); }
  .rz:hover::after, .rz.dragging::after { background: var(--accent); width: 2px; right: 2px; }
  body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
  thead th { position: sticky; background: var(--panel-2); z-index: 2; }
  tr.sort-row th { top: 0; height: var(--head1); padding-left: 8px; padding-right: 8px; color: var(--muted); font-weight: 600; font-size: 12px;
                   text-transform: uppercase; letter-spacing: .04em; cursor: pointer; user-select: none; border-bottom: none; }
  tr.sort-row th:hover { color: var(--text); }
  tr.sort-row th.sorted { color: var(--text); }
  th .arrow { color: var(--accent); margin-left: 4px; }
  tr.filter-row th { top: var(--head1); padding: 4px 6px 7px; background: var(--panel-2); border-bottom: 2px solid var(--line); }
  tr.filter-row th.active { box-shadow: inset 0 -2px 0 var(--accent); }
  .f-input, .f-select, .f-multi { width: 100%; min-width: 80px; background: var(--panel-3); color: var(--text);
          border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; font: inherit; font-size: 12px; height: 26px; }
  .f-input::placeholder { color: #6b7380; }
  .f-input:focus, .f-select:focus, .f-multi:focus { outline: none; border-color: var(--accent); }
  .f-active { border-color: var(--accent); color: var(--accent); }
  .f-multi { text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .f-multi::after { content: "▾"; color: var(--muted); }
                    padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer; height: 26px; }

  .popover { position: fixed; z-index: 20; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
             box-shadow: 0 10px 30px #0008; padding: 6px; min-width: 190px; display: none; }
  .popover.open { display: block; }
  .popover label { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 13px; }
  .popover label:hover { background: var(--accent-dim); }
  .popover label.empty { opacity: .45; }
  .popover .n { margin-left: auto; color: var(--muted); font-size: 12px; }
  .popover input { accent-color: var(--accent); }
  .popover .pop-list { max-height: 300px; overflow-y: auto; }
  .popover .pop-search { width: 100%; margin: 2px 0 6px; height: 28px; }
  .popover .pop-group { padding: 8px 8px 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
                        border-top: 1px solid var(--line); margin-top: 4px; }
  .popover .pop-mode { display: flex; align-items: center; gap: 4px; padding: 2px 8px 6px; font-size: 12px; color: var(--muted);
                       border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .popover .pop-mode label { padding: 2px 4px; font-size: 12px; color: var(--text); gap: 3px; }
  .popover { max-width: 320px; }
  .popover .pop-foot { display: flex; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 4px; padding: 6px 4px 2px; }
  .popover .pop-foot button { background: none; border: none; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; }

  td.num, th.num { text-align: right; }
  tbody tr { cursor: pointer; }
  tbody tr:hover, tbody tr.hl { background: var(--accent-dim); }
  tbody tr.hl td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .route .next { color: var(--accent); font-weight: 600; }
  .muted { color: var(--muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .s-moving { background: #5fcf8022; color: var(--ok); }
  .s-docking { background: #5fa8ef22; color: var(--info); }
  .s-stopped { background: #8c94a122; color: var(--muted); }
  .s-driven { background: #c39cf722; color: var(--driven); }
  .s-error { background: #ef5f5f22; color: var(--bad); }
  .type { display: inline-flex; align-items: center; gap: 7px; }
  .vimg { width: 28px; height: 28px; object-fit: contain; margin: -6px 0; flex: none; }
  .popover .vimg { width: 24px; height: 24px; margin: -4px 0; }
  .fill { display: inline-block; width: 40px; height: 6px; background: var(--line); border-radius: 3px;
          vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .fill i { display: block; height: 100%; background: var(--accent); }

  .map-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 16px 0 8px; }
  .map-head h2 { margin: 0; font-size: 15px; }
  .map-head .hint { color: var(--muted); font-size: 12px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .map-head .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .map-head .map-info { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: -2px; }
  button.b { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
             padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  button.b:hover { border-color: var(--accent); }
  button.b.on { border-color: var(--accent); color: var(--accent); }
  button.layer { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  button.layer i { width: 14px; height: 3px; border-radius: 2px; opacity: .35; flex: none; }
  button.layer.on { color: var(--text); border-color: #4a5260; background: var(--panel-3); }
  button.layer.on i { opacity: 1; }
  button.layer .n { color: var(--muted); font-size: 11px; }

  @media (max-width: 700px) { header, main { padding-left: 16px; padding-right: 16px; } .conn { margin-left: 0; } }

  /* ---- tabs ---- */
  nav.tabs { display: flex; gap: 2px; background: var(--panel-3); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  nav.tabs button { background: none; border: none; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600;
                    padding: 5px 14px; border-radius: 6px; cursor: pointer; }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button.on { background: var(--panel-2); color: var(--accent); box-shadow: 0 1px 0 #0006; }
  @media (max-width: 700px) { nav.tabs { max-width: 100%; overflow-x: auto; scrollbar-width: none; } nav.tabs button { padding: 5px 10px; flex: none; } }
  .stats[hidden], .banner[hidden] { display: none !important; }

  /* ---- shared pieces of the Production / Power tabs ---- */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; }
  .toolbar .right { margin-left: auto; }
  .f-input.search { width: 280px; max-width: 100%; height: 30px; font-size: 13px; }
  .f-input.search.sm { width: 220px; height: 26px; margin-left: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chips.wrap { margin-bottom: 8px; }
  .chips .lbl { font-size: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
          border-radius: 14px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .chip:hover { color: var(--text); border-color: #4a5260; }
  .chip.on { color: var(--text); border-color: var(--accent); background: var(--accent-dim); }
  .chip .n { color: var(--muted); font-size: 11px; }
  .chip .sw { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  /* segmented control: a labelled row of joined buttons, one choice per group (radio) */
  .seg-group { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
  .seg-group.right { margin-left: auto; }
  .seg-group > span:not(.lbl) { display: block; min-width: 0; max-width: 100%; }
  .seg-group .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel-2);
         max-width: 100%; overflow-x: auto; scrollbar-width: none; }   /* narrow screens: swipe sideways inside the control */
  .seg button { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; border-left: 1px solid var(--line);
                color: var(--muted); font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer; white-space: nowrap; height: 28px; }
  .seg button:first-child { border-left: none; }
  .seg button:hover { color: var(--text); background: var(--panel-3); }
  .seg button.on { color: var(--text); background: var(--accent-dim); box-shadow: inset 0 -2px 0 var(--accent); }
  .seg button .n { color: var(--muted); font-size: 11px; }
  .seg button .sw { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 0; }
  .tile.warn { border-color: #f2c14e66; }
  /* clickable tiles: the tile (and any dotted-underlined count in it) filters / sorts or jumps to the details */
  .tile.click { cursor: pointer; transition: border-color .15s, background .15s; }
  .tile.click:hover { border-color: #4a5260; background: var(--panel-2); }
  .tile.on { border-color: var(--accent); background: var(--accent-dim); }
  .tl { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .tl:hover { color: var(--text); }
  .tl.on { color: var(--accent); text-decoration-style: solid; }
  @keyframes flash { from { box-shadow: 0 0 0 2px var(--accent); } to { box-shadow: 0 0 0 2px transparent; } }
  .t-label { color: var(--muted); font-size: 12px; }
  .t-val { font-size: 24px; font-weight: 600; line-height: 1.25; margin: 2px 0; }
  .t-val small { font-size: 13px; font-weight: 400; color: var(--muted); }
  .t-sub { color: var(--muted); font-size: 12px; }
  .tile.bad { border-color: #ef5f5f66; }
  .warn-text { color: var(--warn); } .bad-text { color: var(--bad); }
  @media (max-width: 600px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .t-val { font-size: 20px; } }
  .small { font-size: 12px; margin: 8px 0 0; }
  .banner.bad { background: #ef5f5f1a; border-color: #ef5f5f66; color: var(--bad); margin: 0 0 12px; font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; min-width: 0; }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
  .card-head h2 { margin: 0; font-size: 15px; }
  .card-head .seg button { height: 26px; }
  .card-head .hint { color: var(--muted); font-size: 12px; }
  .card-head .b { margin-left: auto; }
  .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
  .cols { display: grid; grid-template-columns: 1fr; gap: 0 14px; }
  @media (min-width: 1100px) {
    .cols { grid-template-columns: minmax(0, 1.25fr) minmax(360px, 1fr); align-items: start; }
    .cols.even { grid-template-columns: 1fr 1fr; }
    .card.sticky { position: sticky; top: 12px; }
  }
  .icon { width: 24px; height: 24px; object-fit: contain; flex: none; vertical-align: middle; }
  .icon.sm { width: 18px; height: 18px; }
  .with-icon { display: inline-flex; align-items: center; gap: 8px; }
  h2.with-icon { display: flex; } h2.with-icon .icon { width: 28px; height: 28px; }
  .sub { font-size: 11px; }
  .u { font-size: 11px; }

  /* simple sortable tables */
  .dtw { max-height: 60vh; background: var(--panel); }
  .dtw.tall { max-height: 70vh; }
  /* Production/Power tables reuse the Vehicles header (tr.sort-row, .rz); no filter row under it, so it carries the bottom rule */
  table.dt tr.sort-row th { border-bottom: 2px solid var(--line); }
  table.dt tr.sort-row:has(+ tr.filter-row) th { border-bottom: none; }
  table.dt tr.filter-row th { position: sticky; top: var(--head1); z-index: 2; cursor: default; text-transform: none; letter-spacing: 0; }
  table.dt .f-multi .sw, .popover .sw { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  table.dt.fixed td { overflow: hidden; text-overflow: ellipsis; }
  table.dt td { padding: 5px 10px; vertical-align: middle; }
  table.dt tr.sel { background: var(--accent-dim); }
  /* rows related to the clicked item: blue edge = makes it, orange = uses it; the rest fade */
  table.dt tr.rel-make td:first-child { box-shadow: inset 4px 0 0 var(--s1); }
  table.dt tr.rel-use td:first-child { box-shadow: inset 4px 0 0 var(--s2); }
  table.dt tbody.focus tr:not(.rel-make):not(.rel-use) { opacity: .45; }
  .focus-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 8px; }
  .focus-bar:empty { display: none; }
  .focus-bar .key { width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid; display: inline-block; }
  .focus-bar .key.make { border-color: var(--s1); } .focus-bar .key.use { border-color: var(--s2); margin-left: 6px; }
  .focus-bar .b { margin-left: auto; }
  .f-multi.pick { width: auto; min-width: 150px; max-width: 220px; }
  .popover label .icon.sm { margin: -2px 0; }
  table.dt tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  table.dt .io { white-space: nowrap; line-height: 1.5; }
  table.dt .io .icon.sm { margin: 0 2px 0 4px; }

  /* table + map side by side (map below on narrow screens) */
  .split { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .map-side .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  @media (min-width: 1200px) {
    .split { grid-template-columns: minmax(0, 1.8fr) minmax(360px, 1fr); align-items: start; }
    .map-side { position: sticky; top: 12px; }
  }
  .mv-head { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .mv-head .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .mv-head .btns.right { margin-left: auto; }
  .mv-box { position: relative; }
  .mv-box canvas { width: 100%; height: 62vh; min-height: 320px; display: block; border-radius: 8px; border: 1px solid var(--line);
                   background: #0d1013; cursor: grab; }
  .mv-box canvas.dragging { cursor: grabbing; }
  .mv-hint { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: var(--muted); background: rgba(13,16,19,.75);
             padding: 2px 7px; border-radius: 4px; pointer-events: none; }
  .mapview.short .mv-box canvas { height: 44vh; }
  .f-multi.mv-layers { width: auto; min-width: 130px; height: 28px; }
  .mv-menu { z-index: 40; min-width: 220px; }
  .mv-menu .mv-sw { width: 16px; display: inline-flex; justify-content: center; }
  .mv-menu .mv-sw i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
  .mv-menu .mv-sw .icon.sm, .mv-menu .mv-sw .vimg { width: 18px; height: 18px; margin: 0; }
  .mv-menu .pop-list { max-height: 60vh; }
  .mv-menu .pop-group { cursor: pointer; user-select: none; }
  /* the exploration map's header keeps one height whether or not something is picked (no map resize on click) */
  .g-map > .card-head { min-height: 30px; align-items: center; flex-wrap: nowrap; }
  .g-map #pgNodeFilter { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .g-map #pgNodeFilter .b { padding: 2px 8px; font-size: 11px; margin-left: 4px; }
  .mv-menu .pop-group:hover { color: var(--accent); }
  .mv-menu .pop-foot { gap: 8px; }

  /* production: items | machines on top, item details | map below; on desktop it all fits one screen */
  .pgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 14px; }
  .pgrid > .pcol { min-width: 0; }
  .tiles.compact { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .tiles.compact .tile { padding: 6px 12px; }
  .tiles.compact .t-val { font-size: 18px; margin: 0; }
  .tiles.compact .t-sub { line-height: 1.35; }
  .tiles.compact .t-sub .fill { width: 40px; }
  .detail-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .p-detail .kv { margin-top: 4px; }
  @media (max-width: 700px) { .detail-lists { grid-template-columns: 1fr; } }
  /* power: chart + battery + breakdowns on the left, generators + map on the right */
  .break-cols { display: grid; grid-template-columns: 1fr; gap: 0 18px; }
  @media (min-width: 900px) { .break-cols { grid-template-columns: 1fr 1fr; } }
  .flash { animation: flash 1.6s ease-out; }
  /* desktop: tabs marked .onescreen fit the window; each panel scrolls inside itself */

  /* expand-to-full-screen button and state */

           overflow: hidden; background: var(--panel); border: 1px solid #4a5260; border-radius: 10px; padding: 12px 14px;
           box-shadow: 0 20px 60px #000c; max-height: none !important; height: auto !important; }

  .xp-on .lc.lc-fill { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* overview */

           background: var(--panel-3); border-left: 3px solid var(--muted); font-size: 13px; }

  a.attn .ai { width: 16px; text-align: center; flex: none; }

  .ov-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 14px; }

  .big { font-size: 24px; font-weight: 600; line-height: 1.3; }

  .t-sub + .t-sub { margin-top: 3px; }

  .stack { display: flex; gap: 2px; height: 10px; margin: 8px 0 4px; }

  .cost-row .fill { width: 64px; }

  .tier-head .fill { width: 80px; margin: 0; }
  .ms { display: flex; flex-wrap: wrap; gap: 4px; }

  .ms .m.got { color: var(--ok); border-color: #5fcf8044; background: #5fcf8012; }
  .hb[data-node] { cursor: pointer; border-radius: 4px; }
  .hb.on { background: var(--accent-dim); }
  @media (max-width: 600px) { .steps { grid-template-columns: repeat(3, 1fr); } .cost-row { grid-template-columns: 1fr auto; } .cost-row .cost-meta { grid-column: 1 / -1; } }

  /* item detail */
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 10px 0 4px; }

  .glist .g-val { white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* line chart */
  .lc-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .lc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lc-legend i { width: 16px; height: 2px; border-radius: 1px; display: inline-block; }
  .lc-legend i.dash { -webkit-mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 8px); mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 8px); }
  .lc-box { position: relative; }
  .lc-box svg { display: block; overflow: visible; touch-action: pan-y; }

  .lc-grid text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .lc-empty { fill: var(--muted); font-size: 13px; }

  .lc-dot { stroke: var(--panel); stroke-width: 2; }
  .lc-tip { position: absolute; top: 4px; display: none; pointer-events: none; z-index: 5; background: var(--panel-2); border: 1px solid var(--line);
            border-radius: 7px; padding: 6px 10px; font-size: 12px; box-shadow: 0 8px 24px #0009; white-space: nowrap; }
  .lc-tip-head { color: var(--muted); margin-bottom: 3px; }

  /* horizontal bars */

  .hb-label { min-width: 0; overflow: hidden; }

"use strict";
// ---- config ---------------------------------------------------------------
const POLL_MS = 1000;
// World bounds of the 8192x8192 in-game map image, same as FRM's own map (Unreal cm).
const WORLD = { x0: -324698.16796875, y0: -375000, x1: 425301.83203125, y1: 375000 };
const IMG = 8192;

const TYPES = {   // order = filter order; size/shape for map markers; slots = inventory slots (wiki)

  "Truck":        { shape: "arrow", size: 10, slots: 48 },
  "Fluid Truck":  { shape: "arrow", size: 10, tankM3: 3200 },
  "Explorer":     { shape: "arrow", size: 8, slots: 12 },
  "Cyber Wagon":  { shape: "arrow", size: 8, slots: 1 },
  "Train":        { shape: "train", size: 9 },
  "Drone":        { shape: "drone", size: 8, slots: 9 },
};
const typeOf = cls =>
  /Golfcart/i.test(cls) ? "Factory Cart" : /Tractor/i.test(cls) ? "Tractor" :
  /FluidTruck/i.test(cls) ? "Fluid Truck" : /Truck/i.test(cls) ? "Truck" :
  /Explorer/i.test(cls) ? "Explorer" : /Cyber|Testa/i.test(cls) ? "Cyber Wagon" : "Factory Cart";   // Cyber Wagon's class is Testa_BP_WB_C

const STATUS = ["moving", "docking", "stopped", "driven", "error"];
const STATUS_LABEL = { error: "Error", driven: "Driven", moving: "Moving", docking: "Docking", stopped: "Stopped" };
const STATUS_ORDER = { error: 0, driven: 1, moving: 2, docking: 3, stopped: 4 };
const STATUS_COLOR = { moving: "#5fcf80", docking: "#5fa8ef", stopped: "#c5cad3", driven: "#c39cf7", error: "#ef5f5f" };
// station squares use colors no vehicle status uses

// ---- state ----------------------------------------------------------------
let vehicles = [];

const motion = new Map();   // id -> {fx,fy,tx,ty,frot,trot,t0}  (image px, canvas angle deg)
const history = new Map();  // id -> recent world positions [{t,x,y,z}]

let sort = { key: "type", dir: 1 };   // type never changes, and ties fall back to vehicle ID, so rows stay put

const MULTI_KEYS = ["type", "status", "next", "route", "near", "cargo"];
const DEFAULT_FILTERS = { id: "", type: [], status: [], next: [], route: [], routeMode: "any", cargo: [], cargoMode: "any", fill: "", near: [], auto: "", driver: "" };
const freshFilters = () => ({ ...DEFAULT_FILTERS, ...Object.fromEntries(MULTI_KEYS.map(k => [k, []])) });

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const idNum = v => +String(v.id).replace(/^.*_/, "") || 0;

function loadFilters() {
  try {
    const f = { ...freshFilters(), ...JSON.parse(localStorage.getItem("vt.filters2") || "{}") };
    const legacyCargo = { loaded: "__loaded", empty: "__empty" };   // older saves stored single values
    if (typeof f.cargo === "string") f.cargo = f.cargo ? [legacyCargo[f.cargo] || f.cargo.replace(/^item:/, "")] : [];
    for (const k of MULTI_KEYS) if (!Array.isArray(f[k])) f[k] = f[k] && typeof f[k] === "string" && k !== "route" ? [f[k]] : [];
    return f;
  } catch { return freshFilters(); }
}
function saveFilters() { try { localStorage.setItem("vt.filters2", JSON.stringify(filters)); } catch {} }

// ---- normalization ----------------------------------------------------------
// FRM rotation: 0..360, 0 = north (= Unreal yaw + 90). Canvas angle: 0 = +X (east), clockwise.
const headingToCanvas = r => (r || 0) - 90;

// "moving" when speed is known; else travelled > 2 m within the last 10 s
const MOVE_WINDOW_MS = 10000, MOVE_MIN_CM = 200;
function travelled(id, l) {
  const now = Date.now(), h = history.get(id) || [];
  h.push({ t: now, x: l.x, y: l.y, z: l.z });
  while (h.length && now - h[0].t > MOVE_WINDOW_MS) h.shift();
  history.set(id, h);
  return Math.max(...h.map(p => Math.hypot(l.x - p.x, l.y - p.y, l.z - p.z)));
}

function fromWheeled(c) {
  const dist = travelled(c.ID, c.location);
  const speed = "LocationSource" in c ? Math.abs(c.ForwardSpeed) : null;
  const isMoving = speed !== null ? speed > 1 : dist > MOVE_MIN_CM;
  const status = c.Driver ? "driven" : (c.AutoPilotStatus && c.AutoPilotStatus !== "None") ? "error"
               : c.IsCurrentlyDocking ? "docking" : isMoving ? "moving" : "stopped";
  const inv = (c.Inventory || []).filter(i => i.Amount > 0);
  const type = typeOf(c.ClassName), tank = TYPES[type].tankM3;
  // Fluids are usually stored in liters internally; treat amounts that can't fit the tank in m³ as liters
  const m3 = i => i.Amount > tank || (i.MaxAmount || 0) > 50000 ? i.Amount / 1000 : i.Amount;
  // Solid cargo: FRM groups items and reports MaxAmount = one stack, so fill = stacks used / slots
  const stacks = tank ? 0 : inv.reduce((a, i) => a + i.Amount / (i.MaxAmount || i.Amount), 0);
  return {
    id: c.ID, type, golden: /Gold/i.test(c.ClassName), name: c.Name, status, error: c.AutoPilotStatus, speed,
    route: Array.isArray(c.Route) ? c.Route.map(w => ({ name: w.Name, next: w.IsNextStop })) : null,
    nextStop: c.NextStop || "", autopilot: !!c.Autopilot, driver: c.Driver || "",
    items: inv.map(i => tank ? { name: i.Name, amount: m3(i), unit: "m³" } : itemOf(i.Name, i.Amount)),
    fill: Math.min(1, tank ? inv.reduce((a, i) => a + m3(i), 0) / tank : stacks / TYPES[type].slots),
    loc: c.location, rot: headingToCanvas(c.location.rotation), rail: false,
  };
}

// FRM's self-driving / path error codes -> words ("SDLE_StationUnreachable" -> "Station unreachable")
const trainErr = code => !code || /_NoError$/.test(code) ? "" :
  code.replace(/^[A-Z]+_/, "").replace(/([a-z])([A-Z])/g, "$1 $2").toLowerCase().replace(/^./, c => c.toUpperCase());
function fromTrain(t) {
  const id = t.ID || "Train_" + t.Name;
  // a self-driving train can be stuck with an autopilot / pathing error (no route, station unreachable, no power…)
  const autoErr = t.Status === "Self-Driving" ? trainErr(t.SelfDriving) || trainErr(t.Path) : "";
  const dist = travelled(id, t.location);
  const speed = typeof t.ForwardSpeed === "number" ? Math.abs(t.ForwardSpeed) : null;
  const isMoving = (speed !== null && speed > 1) || dist > MOVE_MIN_CM;
  const status = t.Derailed || t.Status === "Derailed" || autoErr ? "error"
               : t.Status === "Manual Driving" ? "driven"
               : t.Docking && t.Docking !== "TDS_None" ? "docking"
               : isMoving ? "moving" : "stopped";
  const stops = (t.TimeTable || []).map((s, i) => ({ name: s.StationName, next: i === t.TimeTableIndex }));
  const grouped = {};
  for (const car of t.Vehicles || []) for (const i of car.Inventory || []) if (i.Amount > 0) grouped[i.Name] = (grouped[i.Name] || 0) + i.Amount;
  const cars = t.Vehicles || [];
  const locos = cars.filter(c => /Locomotive/i.test(c.ClassName)).length;
  return {
    id, type: "Train", name: t.Name, status, error: t.Derailed ? "Derailed" : autoErr || t.Status, speed,
    consist: cars.length ? `${locos} loco${locos === 1 ? "" : "s"}+${cars.length - locos} car${cars.length - locos === 1 ? "" : "s"}` : "",
    route: stops, nextStop: stops.find(s => s.next)?.name || t.TrainStation || "",
    autopilot: t.Status === "Self-Driving", driver: t.Status === "Manual Driving" ? "(manual)" : "",
    items: Object.entries(grouped).map(([name, amount]) => itemOf(name, amount)),
    fill: t.MaxPayloadMass ? t.PayloadMass / t.MaxPayloadMass : 0,
    loc: t.location, rot: headingToCanvas(t.location.rotation), rail: true,
  };
}

// Drones: status comes from the home port; cargo needs the patched FRM (Inventory on getDrone)
// port states while the drone itself isn't flying (speed ~0); a flying drone is always "moving"
const DRONE_STATUS = { "En Route": "docking", "Taking Off": "docking", "Docking": "docking", "Docked": "stopped",
                       "Loading": "docking", "Unloading": "docking", "Not Enough Fuel": "error", "Cannot Unload": "error" };
function fromDrone(d) {
  const id = d.ID || "Drone_" + d.HomeStation;
  travelled(id, d.location);
  const port = dronePorts.find(p => p.Name === d.HomeStation);
  const portStatus = port?.DroneStatus || "";
  const speed = typeof d.FlyingSpeed === "number" ? d.FlyingSpeed : null;
  const flying = speed > 1;
  let status = DRONE_STATUS[portStatus] === "error" ? "error" : flying ? "moving" : DRONE_STATUS[portStatus] || "stopped";
  const dest = d.CurrentDestination && d.CurrentDestination !== "No Destination" ? d.CurrentDestination : "";
  const stops = [d.HomeStation, d.HasPairedStation ? d.PairedStation : null].filter(Boolean);
  const inv = (d.Inventory || []).filter(i => i.Amount > 0);
  return {
    id, type: "Drone", name: d.Name, status, error: portStatus, speed,
    route: stops.map(s => ({ name: s, next: s === dest })), nextStop: dest,
    autopilot: true, driver: "",
    items: inv.map(i => itemOf(i.Name, i.Amount)),
    fill: Math.min(1, inv.reduce((a, i) => a + i.Amount / (i.MaxAmount || i.Amount), 0) / TYPES.Drone.slots),
    loc: d.location, rot: headingToCanvas(d.location.rotation), rail: false, air: true,
  };
}

// fluids (by the game's item list) are shown in m³
const fluidNames = () => new Set(gameItems.filter(i => i.kind === "fluid").map(i => i.name));
let fluidSet = new Set();
const itemOf = (name, amount) => fluidSet.has(name) ? { name, amount, unit: "m³" } : { name, amount };

function nearestStation(v) {
  let best = null, bd = Infinity;
  for (const s of v.rail ? trainStations : v.air ? dronePorts : truckStations) {
    const d = Math.hypot(s.location.x - v.loc.x, s.location.y - v.loc.y);
    if (d < bd) { bd = d; best = s; }
  }
  return best ? { name: best.Name, dist: bd / 100 } : { name: "", dist: Infinity };
}
const cargoText = v => v.items.map(i => i.unit ? `${i.name} ${Math.round(i.amount).toLocaleString()} ${i.unit}` : `${i.name} ×${i.amount}`).join(", ");
const fillBucket = v => v.fill <= 0 ? "empty" : v.fill >= 0.999 ? "full" : "partial";

// ---- columns: sort value, cell, and the filter that lives under the header ----------

const TYPE_IMG = { "Factory Cart": "factory-cart", "Tractor": "tractor", "Truck": "truck", "Fluid Truck": "fluid-truck", "Explorer": "explorer",
                   "Cyber Wagon": "cyber-wagon", "Train": "train", "Drone": "drone" };
const typeImg = (type, golden) => `<img class="vimg" src="/img/${golden ? "golden-factory-cart" : TYPE_IMG[type] || "factory-cart"}.png" alt="">`;
const uniq = arr => [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b));
// every item in the game (items.json, extracted from the game's CommunityResources/Docs/en-US.json);

let gameItems = [];
const itemsReady = fetch("/items.json").then(r => r.json()).then(j => { gameItems = j; fluidSet = fluidNames(); if (popKey === "cargo") renderPopover(); }).catch(() => {});
function cargoOptions() {
  const onboard = new Set(vehicles.flatMap(v => v.items.map(i => i.name)));
  const known = new Map(gameItems.map(i => [i.name, i.kind]));
  for (const n of onboard) if (!known.has(n)) known.set(n, "solid");   // modded items etc.
  const opt = (name, kind) => ({ value: name, label: esc(name), group: kind === "fluid" ? "Fluids" : "Items", dim: !onboard.has(name) });
  const all = [...known].map(([n, k]) => opt(n, k)).sort((a, b) => a.value.localeCompare(b.value));
  return [{ value: "__loaded", label: "Loaded (any cargo)", group: "" }, { value: "__empty", label: "Empty", group: "" },
          ...all.filter(o => o.group === "Items"), ...all.filter(o => o.group === "Fluids")];
}

// one station list shared by the Next stop, Route and Nearest station filters
function stationOptions() {
  return uniq([...vehicles.flatMap(v => [v.nextStop, ...(v.route || []).map(w => w.name)]),
               ...truckStations.map(s => s.Name), ...trainStations.map(s => s.Name), ...dronePorts.map(s => s.Name)])
    .map(s => ({ value: s, label: esc(s) }));
}
const textMatch = (hay, q) => q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.toLowerCase().includes(t));

const COLS = [
  { key: "id", label: "Vehicle", val: v => idNum(v),   // by the number shown (#41531)
    // ID, then custom name, then train makeup, one per line
    cell: v => [`<b>${esc(shortId(v.id))}</b>`,
                v.name && !/^(Factory Cart™|Golden Factory Cart™|Tractor|Truck|Fluid Truck|Explorer|Cyber Wagon|Train|Drone)$/.test(v.name) ? `<span class="sub">${esc(v.name)}</span>` : "",
                v.consist ? `<span class="sub muted">${esc(v.consist)}</span>` : ""].filter(Boolean).join("<br>"),
    cls: "vid",
    filter: { kind: "text", placeholder: "#id or name", test: (v, q) => textMatch(shortId(v.id) + " " + v.name, q) } },
  { key: "type", label: "Type", val: v => v.type,

    cell: v => {

      return `<span class="pill s-${v.status}" title="${esc(v.error)}">${v.status === "error" ? esc(v.error) : STATUS_LABEL[v.status]}</span>${where}`;
    },
    filter: { kind: "multi", all: "All statuses", options: () => STATUS.map(s => ({ value: s, label: `<span style="color:${STATUS_COLOR[s]}">●</span> ${STATUS_LABEL[s]}` })), get: v => v.status } },
  { key: "speed", label: "km/h", title: "Speed (km/h)", num: true, optional: () => hasSpeed, val: v => v.speed ?? -1,
    cell: v => v.speed === null ? `<span class="muted">—</span>` : v.speed.toFixed(0) },
  { key: "next", label: "Next stop", val: v => v.nextStop,
    cell: v => v.route === null ? `<span class="muted">n/a</span>` : v.nextStop ? `<span style="color:var(--accent)">${esc(v.nextStop)}</span>` : `<span class="muted">—</span>`,
    filter: { kind: "multi", all: "Any stop", unit: "stations", search: true, options: stationOptions, get: v => v.nextStop } },
  { key: "route", label: "Route", val: v => (v.route || []).map(w => w.name).join(" "),
    cell: v => {
      if (v.route === null) return `<span class="muted" title="Stock FRM reports every route as the placeholder &quot;PathName&quot;">needs patched FRM</span>`;
      if (!v.route.length) return `<span class="muted">no route</span>`;
      return `<span class="route">${v.route.map(w => w.next ? `<span class="next">${esc(w.name)}</span>` : esc(w.name)).join(" → ")}</span>`;
    },
    filter: { kind: "multi", all: "Any station", unit: "stations", search: true, modes: true, options: stationOptions,
      getMany: v => (v.route || []).map(w => w.name) } },
  { key: "cargo", label: "Cargo", cls: "cargo", val: v => cargoText(v), cell: v => esc(cargoText(v)) || `<span class="muted">empty</span>`,
    filter: { kind: "multi", all: "Any cargo", unit: "selected", search: true, modes: true, modeLabel: "Carrying", searchLabel: "Find item…",
      options: cargoOptions, getMany: v => [v.items.length ? "__loaded" : "__empty", ...v.items.map(i => i.name)] } },
  { key: "fill", label: "Fill", num: true, val: v => v.fill,
    cell: v => `<span class="fill"><i style="width:${(v.fill * 100).toFixed(0)}%"></i></span>${(v.fill * 100).toFixed(0)}%`,
    filter: { kind: "select", all: "Any", options: () => [{ value: "empty", label: "Empty" }, { value: "partial", label: "Partial" }, { value: "full", label: "Full" }],
      test: (v, q) => fillBucket(v) === q } },
  { key: "near", label: "Nearest", title: "Nearest station", val: v => nearestStation(v).name,
    cell: v => { const n = nearestStation(v); return n.name ? `${esc(n.name)} <span class="muted">${n.dist < 1000 ? n.dist.toFixed(0) + " m" : (n.dist / 1000).toFixed(1) + " km"}</span>` : `<span class="muted">—</span>`; },
    filter: { kind: "multi", all: "Any station", unit: "stations", search: true, options: stationOptions, get: v => nearestStation(v).name } },
  { key: "auto", label: "Auto", title: "Autopilot", val: v => v.autopilot ? 1 : 0, cell: v => v.autopilot ? "on" : `<span class="muted">off</span>`,
    filter: { kind: "select", all: "Any", options: () => [{ value: "on", label: "On" }, { value: "off", label: "Off" }], test: (v, q) => v.autopilot === (q === "on") } },
  { key: "driver", label: "Driver", val: v => v.driver, cell: v => esc(v.driver) || `<span class="muted">—</span>`,
    filter: { kind: "select", all: "Any", options: () => [{ value: "__driven", label: "Someone driving" }, { value: "__none", label: "Nobody" },
      ...uniq(vehicles.map(v => v.driver)).map(d => ({ value: d, label: d, group: "Player" }))],
      test: (v, q) => q === "__driven" ? !!v.driver : q === "__none" ? !v.driver : v.driver === q } },
  { key: "x", label: "X m", num: true, val: v => v.loc.x, cell: v => (v.loc.x / 100).toFixed(0) },
  { key: "y", label: "Y m", num: true, val: v => v.loc.y, cell: v => (v.loc.y / 100).toFixed(0) },
  { key: "z", label: "Z m", num: true, val: v => v.loc.z, cell: v => (v.loc.z / 100).toFixed(0) },
];
const cols = () => COLS.filter(c => !c.optional || c.optional());

// ---- filtering ------------------------------------------------------------------
const isActive = c => { const f = filters[c.key]; return Array.isArray(f) ? f.length > 0 : !!f; };
function passes(v, ignoreKey) {
  for (const c of cols()) {
    if (!c.filter || c.key === ignoreKey || !isActive(c)) continue;
    const q = filters[c.key];
    if (c.filter.kind === "multi") {
      const vals = c.filter.getMany ? c.filter.getMany(v) : [c.filter.get(v)];
      const all = c.filter.modes && filters[c.key + "Mode"] === "all";
      if (!(all ? q.every(x => vals.includes(x)) : q.some(x => vals.includes(x)))) return false;
    } else if (!c.filter.test(v, q)) return false;
  }
  return true;
}
const visible = () => vehicles.filter(v => passes(v));
const anyActive = () => COLS.some(c => c.filter && isActive(c));

// ---- header: sort row + filter row ---------------------------------------------------
let headSig = "";
function renderHead() {
  const cs = cols(), sig = cs.map(c => c.key).join();
  if (sig !== headSig) {   // (re)build both rows only when the column set changes, so inputs keep focus
    headSig = sig;
    $("sortRow").innerHTML = cs.map(c => `<th data-key="${c.key}" class="${c.num ? "num" : ""}"></th>`).join("");
    $("filterRow").innerHTML = cs.map(c => {
      if (!c.filter) return `<th></th>`;
      if (c.filter.kind === "text") return `<th data-f="${c.key}"><input class="f-input" type="search" data-f="${c.key}" placeholder="${esc(c.filter.placeholder)}"></th>`;
      if (c.filter.kind === "select") return `<th data-f="${c.key}"><select class="f-select" data-f="${c.key}"></select></th>`;
      return `<th data-f="${c.key}"><button class="f-multi" data-f="${c.key}"></button></th>`;
    }).join("");

    layoutPending = true;
  }
  for (const th of $("sortRow").children) {
    const c = COLS.find(x => x.key === th.dataset.key);
    th.classList.toggle("sorted", sort.key === c.key);
    th.title = c.title || "";
    th.innerHTML = `${c.label}${sort.key === c.key ? `<span class="arrow">${sort.dir > 0 ? "▲" : "▼"}</span>` : ""}<span class="rz" data-rz="${c.key}" title="Drag to resize · double-click to fit"></span>`;
  }
  renderFilterControls();
}

// ---- column widths (resizable, remembered) -----------------------------------------
let userWidths = (() => { try { return JSON.parse(localStorage.getItem("vt.widths") || "{}"); } catch { return {}; } })();
const autoWidths = {};      // measured defaults for columns the user hasn't sized
let layoutPending = true, justResized = false;
const MAX_AUTO_W = 320, MIN_W = 48;

let resizingKey = null;   // column whose edge is being dragged (spare width goes elsewhere meanwhile)
function applyWidths() {
  const cs = cols();
  const ws = settleWidths(cs.map(c => userWidths[c.key] || autoWidths[c.key] || 100), $("tableWrap").clientWidth - 2,
                          cs.findIndex(c => c.key === resizingKey));
  $("colgroup").innerHTML = cs.map((c, i) => `<col data-col="${c.key}" style="width:${ws[i]}px">`).join("");
  $("table").style.width = ws.reduce((a, b) => a + b, 0) + "px";
  $("table").classList.add("fixed");
}

// measure natural (unwrapped) widths once real rows exist, cap them, then shrink the text columns
// so the table fits the panel; finally lock to fixed layout
// how far each column may shrink when fitting the panel (text columns wrap, so they give up most)
// (sized so content never clips: "Factory Cart" + image, "100%" + bar, 5-digit coords, "1 loco+2 cars")
const MIN_COL_W = { route: 88, next: 94, near: 90, cargo: 76, driver: 66, id: 94, type: 130, status: 92,
                    speed: 66, fill: 100, auto: 60, x: 56, y: 58, z: 44 };
function layoutColumns() {
  if (!layoutPending || !vehicles.length) return;
  layoutPending = false;
  const t = $("table");
  t.classList.remove("fixed"); t.classList.add("measuring"); t.style.width = "auto"; $("colgroup").innerHTML = "";
  for (const th of $("sortRow").children)
    autoWidths[th.dataset.key] = Math.min(MAX_AUTO_W, Math.max(MIN_W, MIN_COL_W[th.dataset.key] || 0, th.offsetWidth));
  t.classList.remove("measuring");
  const keys = cols().map(c => c.key), avail = $("tableWrap").clientWidth - 2;
  const total = () => keys.reduce((a, k) => a + (userWidths[k] || autoWidths[k]), 0);
  let over = total() - avail;
  const shrink = keys.filter(k => k in MIN_COL_W && !userWidths[k]);
  for (let pass = 0; over > 0 && pass < 4; pass++) {
    const room = shrink.map(k => Math.max(0, autoWidths[k] - MIN_COL_W[k])), sum = room.reduce((a, b) => a + b, 0);
    if (!sum) break;

async function getJSON(ep) {

let fitted = false;
async function poll() {
  if (activeTab !== "vehicles") return;
  try {
    const [wheeled, trains, drones, ports] = await Promise.all([getJSON("getVehicles"), getJSON("getTrains").catch(() => []),
      getJSON("getDrone").catch(() => []), getJSON("getDroneStation").catch(() => null)]);
    if (ports) dronePorts = ports;
    const next = wheeled.map(fromWheeled).concat(trains.map(fromTrain), drones.map(fromDrone));
    const now = performance.now();
    for (const v of next) {
      const p = worldToImg(v.loc.x, v.loc.y), m = motion.get(v.id);
      if (!m) motion.set(v.id, { fx: p.x, fy: p.y, tx: p.x, ty: p.y, frot: v.rot, trot: v.rot, t0: now });
      else { const c = interp(m, now); Object.assign(m, { fx: c.x, fy: c.y, frot: c.rot, tx: p.x, ty: p.y, trot: v.rot, t0: now }); }
    }
    const ids = new Set(next.map(v => v.id));
    for (const id of [...motion.keys()]) if (!ids.has(id)) { motion.delete(id); history.delete(id); }
    vehicles = next;

    hasSpeed = wheeled.some(c => "LocationSource" in c) || trains.length > 0 || drones.length > 0;
    const routesSupported = !wheeled.length || wheeled.some(c => Array.isArray(c.Route));
    $("banner").style.display = routesSupported ? "none" : "block";
    $("banner").textContent = "Route / Next stop for wheeled vehicles need the patched FRM build — this server runs stock FRM, which reports every route as the placeholder \"PathName\". Trains show their timetable either way.";
    $("dot").className = "dot ok";
    $("conn").textContent = "live · " + new Date().toLocaleTimeString();
    renderStats(); renderHead(); renderTable(); layoutColumns(); renderLayerButtons();
    if (!fitted && vehicles.length) { fitVehicles(); fitted = true; }
  } catch (e) {
    $("dot").className = "dot bad";
    $("conn").textContent = "offline: " + e.message;
  }
}

// drones fly straight between paired ports: one line per pair
function droneLinks() {
  const byName = new Map(dronePorts.map(p => [p.Name, p])), seen = new Set(), links = [];
  for (const p of dronePorts) {
    const q = byName.get(p.PairedStation); if (!q) continue;
    const key = [p.Name, q.Name].sort().join("|"); if (seen.has(key)) continue;
    seen.add(key); links.push(Object.assign([p.location, q.location], { names: [p.Name, q.Name] }));
  }
  return links;
}

  let best = null, bd = 11;
  for (const [kind, list] of groups) for (const s of list) {
    const p = toScreen(worldToImg(s.location.x, s.location.y)), d = Math.hypot(p.x - mx, p.y - my);
    if (d < bd) { bd = d; best = { kind, s }; }
  }
  return best;
}
const invRows = (inv, empty = "empty") => {
  const items = (inv || []).filter(i => i.Amount > 0);
  if (!items.length) return `<div class="row muted"><span>${empty}</span></div>`;
  return items.map(i => { const it = itemOf(i.Name, i.Amount);
    return `<div class="row"><span>${esc(i.Name)}</span><b>${it.unit ? Math.round(it.amount).toLocaleString() + " " + it.unit : "×" + it.amount.toLocaleString()}</b></div>`; }).join("");
};
const popSection = title => `<div class="head" style="border-top:1px solid var(--line);border-bottom:none;margin:4px 0 0;padding-top:6px">${esc(title)}</div>`;
function stationPopHtml({ kind, s }) {
  if (kind === "truck") {
    const fuel = (s.FuelInventory || []).some(i => i.Amount > 0) ? popSection("Fuel") + invRows(s.FuelInventory) : "";
    return `<div class="head"><b style="color:${STATION_COLOR.truck}">■</b> ${esc(s.Name)} · Truck station · ${esc(s.LoadMode || "")}</div>` + invRows(s.Inventory) + fuel;
  }
  if (kind === "train") {
    const plats = (s.CargoInventory || []).map((p, i) =>
      popSection(`Platform ${i + 1} · ${p.Name || "Platform"}${p.LoadingMode ? " · " + p.LoadingMode : ""}${p.DockingStatus ? " · " + p.DockingStatus : ""}`) + invRows(p.Inventory)).join("");
    return `<div class="head"><b style="color:${STATION_COLOR.train}">■</b> ${esc(s.Name)} · Train station</div>` + (plats || `<div class="row muted"><span>no freight platforms</span></div>`);
  }
  const paired = s.PairedStation && s.PairedStation !== "None" ? ` · paired → ${esc(s.PairedStation)}` : " · not paired";
  return `<div class="head"><b style="color:${STATION_COLOR.drone}">■</b> ${esc(s.Name)} · Drone port · ${esc(s.DroneStatus || "")}${paired}</div>` +
    popSection("Input (to send)") + invRows(s.InputInventory) + popSection("Output (received)") + invRows(s.OutputInventory) +
    ((s.FuelInventory || []).some(i => i.Amount > 0) ? popSection("Fuel") + invRows(s.FuelInventory) : "");
}
function showPopAt(html, x, y) {
  cargoPop.innerHTML = html; cargoPop.style.display = "block";
  const r = cargoPop.getBoundingClientRect();
  cargoPop.style.left = Math.min(x + 14, innerWidth - r.width - 8) + "px";
  cargoPop.style.top = (y + 18 + r.height > innerHeight ? Math.max(8, y - r.height - 10) : y + 18) + "px";
}


// icons/lines shrink as you zoom out (full size from ~0.8 zoom up, never below 40%)
const iconScale = (mv = vmap) => Math.max(0.4, Math.min(1, Math.sqrt(mv.view.s / 0.8)));

function drawMarker(v, p, rot, isF) {
  const t = TYPES[v.type] || TYPES["Factory Cart"], size = isF ? t.size + 4 : t.size * iconScale();
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(rot * Math.PI / 180);
  ctx.fillStyle = STATUS_COLOR[v.status]; ctx.strokeStyle = "#0d1013"; ctx.lineWidth = 2;
  ctx.beginPath();
  if (t.shape === "train") ctx.roundRect(-size * 1.6, -size * 0.6, size * 3.2, size * 1.2, 3);
  else if (t.shape === "drone") {   // diamond with a nose so heading still reads
    ctx.moveTo(size * 1.5, 0); ctx.lineTo(0, size * 0.9); ctx.lineTo(-size * 0.9, 0); ctx.lineTo(0, -size * 0.9); ctx.closePath();
  }
  else { ctx.moveTo(size * 1.4, 0); ctx.lineTo(-size, size * 0.85); ctx.lineTo(-size * 0.5, 0); ctx.lineTo(-size, -size * 0.85); ctx.closePath(); }
  ctx.fill(); ctx.stroke(); ctx.restore();
}

function drawStation(mv, s, color, label, dim) {
  const ctx = mv.ctx, p = mv.toScreen(worldToImg(s.location.x, s.location.y)), r = mv.canvas.getBoundingClientRect();
  if (p.x < -50 || p.y < -50 || p.x > r.width + 50 || p.y > r.height + 50) return;
  ctx.globalAlpha = dim ? 0.3 : 1;
  const h = 5 * iconScale(mv);
  ctx.fillStyle = color; ctx.strokeStyle = "#0d1013"; ctx.lineWidth = h > 3 ? 2 : 1;
  ctx.beginPath(); ctx.rect(p.x - h, p.y - h, h * 2, h * 2); ctx.fill(); ctx.stroke();
  if (mv.view.s > 0.2 && !dim) {
    const w = ctx.measureText(s.Name).width, box = { x: p.x + h + 4, y: p.y - 8, w: w + 8, h: 16 };
    if (claimLabel(box)) {   // skip names that would overlap ones already drawn this frame
      ctx.fillStyle = "rgba(13,16,19,.75)"; ctx.fillRect(box.x, box.y, box.w, box.h);
      ctx.fillStyle = label; ctx.fillText(s.Name, box.x + 4, p.y);
    }
  }
  ctx.globalAlpha = 1;
}

// per-frame label collision list (reset at the start of each draw)
let placedLabels = [];
function claimLabel(b) {
  for (const o of placedLabels) if (b.x < o.x + o.w + 2 && o.x < b.x + b.w + 2 && b.y < o.y + o.h + 1 && o.y < b.y + b.h + 1) return false;
  placedLabels.push(b); return true;
}

// a focused vehicle's stops: pulsing rings + always-on labels (stop number or Home/Paired, "→ next")
const hexA = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;
function drawStopHighlight(st, color, tag, isNext, now) {
  const p = toScreen(worldToImg(st.location.x, st.location.y));
  const pulse = (now % 1400) / 1400;
  ctx.strokeStyle = hexA(color, 0.9 * (1 - pulse)); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(p.x, p.y, 12 + pulse * 20, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = isNext ? 3 : 2;
  ctx.beginPath(); ctx.rect(p.x - 10, p.y - 10, 20, 20); ctx.stroke();
  ctx.fillStyle = color; ctx.strokeStyle = "#0d1013";
  ctx.beginPath(); ctx.rect(p.x - 6, p.y - 6, 12, 12); ctx.fill(); ctx.stroke();
  const text = `${st.Name} · ${tag}${isNext ? " → next" : ""}`;
  ctx.font = "600 12px Segoe UI, sans-serif"; ctx.textBaseline = "middle";
  // below-right of the station, so it never collides with the focused vehicle's label (drawn above-right)
  const w = ctx.measureText(text).width, ly = p.y + 6;
  ctx.fillStyle = "rgba(13,16,19,.92)"; ctx.fillRect(p.x + 14, ly, w + 12, 20);
  ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.strokeRect(p.x + 14.5, ly + .5, w + 11, 19);
  ctx.fillStyle = "#fff"; ctx.fillText(text, p.x + 20, ly + 10);
}

// station list + color for a vehicle's kind of stops
const stopsFor = v => v.rail ? { list: trainStations, color: STATION_COLOR.train }
                    : v.air ? { list: dronePorts, color: STATION_COLOR.drone }
                    : { list: truckStations, color: STATION_COLOR.truck };

// Roads, cart paths, train tracks, drone routes and stations, on any map (Vehicles and Overview).
// on(key) says which layers are shown. focus (Vehicles only): stops = station names to leave out because they're
// drawn highlighted, drone = a drone is focused (other routes fade), link(l) = that drone's own route.
function drawNetwork(mv, on, focus = {}) {
  const ctx = mv.ctx, view = mv.view;
  placedLabels = [];
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const stroke = (pts, color, width) => {
    if (pts.length < 2) return;
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
    pts.forEach((q, i) => { const s = mv.toScreen(worldToImg(q.x, q.y)); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
    ctx.stroke();
  };
  const w = Math.max(1, Math.min(4, 3 * view.s));
  // paths drawn like roads: dark casing underneath, bright opaque line on top
  const k = iconScale(mv), pw = Math.max(1.2, Math.min(5, 3.5 * view.s)), casing = pw + 3 * k;
  // all casings first, then all lines, so segment joins don't show dark seams
  const shown = paths.filter(p => p.cart ? on("cartPaths") : on("vehPaths"));
  for (const p of shown) stroke(p.pts, "rgba(10,12,16,.85)", casing);
  for (const p of shown) stroke(p.pts, p.cart ? PATH_COLOR.cart : PATH_COLOR.vehicle, pw);
  if (on("rails")) {   // two-tone so track reads differently from roads; casings first to avoid seams
    for (const r of rails) stroke(r.pts, "rgba(13,16,19,.8)", w + 3 * k);
    for (const r of rails) stroke(r.pts, "rgba(195,156,247,.85)", Math.max(1, w - 0.5));
  }
  const isLink = focus.link || (() => false);
  if (on("droneRoutes") || focus.drone) {
    ctx.setLineDash([8 * k, 6 * k]);
    for (const l of droneLinks()) {
      if (isLink(l)) continue;
      if (on("droneRoutes")) stroke(l, focus.drone ? "rgba(240,98,146,.2)" : "rgba(240,98,146,.75)", Math.max(1, w * k));
    }
    ctx.setLineDash([]);
    for (const l of droneLinks()) if (isLink(l)) {
      stroke(l, "rgba(13,16,19,.85)", Math.max(4, w + 4));
      stroke(l, "#f06292", Math.max(2.5, w + 1));
    }
  }
  ctx.font = "11px Segoe UI, sans-serif"; ctx.textBaseline = "middle";
  const fade = !!focus.stops, skip = s => focus.stops && focus.stops.has(s.Name);
  // each station type is its own layer; label priority when names collide: train, then truck, then drone
  if (on("trainStations")) for (const s of trainStations) if (!skip(s)) drawStation(mv, s, STATION_COLOR.train, "#e2d4fb", fade);
  if (on("truckStations")) for (const s of truckStations) if (!skip(s)) drawStation(mv, s, STATION_COLOR.truck, "#ffffff", fade);
  if (on("dronePorts")) for (const s of dronePorts) if (!skip(s)) drawStation(mv, s, STATION_COLOR.drone, "#f8c6d8", fade);
}

// called by the shared map each frame, after it has drawn the map image
function draw(now) {
  if (followId && !vmap.dragging && !vmap.anim) centerOn(followId, false);   // let a glide finish first
  // focused vehicle (hovered row/marker or followed): its stops stand out, other stations fade;
  // for drones the link between their two ports is drawn solid too
  const focusV = (hoverId || followId) && vehicles.find(v => v.id === (hoverId || followId));
  const focusStops = focusV && focusV.route && focusV.route.length ? new Set(focusV.route.map(w => w.name)) : null;
  const focusDrone = focusV && focusV.type === "Drone" ? focusV : null;
  const focusPorts = focusDrone ? focusStops : null;
  drawNetwork(vmap, k => layers[k], { stops: focusStops, drone: !!focusDrone,
    link: l => focusPorts && focusPorts.size === 2 && l.names.every(n => focusPorts.has(n)) });

  if (focusStops) {   // stops drawn even if the Stations layer is off; dotted guide from vehicle to its next stop
    const { list, color } = stopsFor(focusV);
    const m = motion.get(focusV.id), vp = m && toScreen(interp(m, now));
    const next = list.find(s => s.Name === focusV.nextStop);
    if (vp && next) {
      const q = toScreen(worldToImg(next.location.x, next.location.y));
      ctx.setLineDash([2, 5]); ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(vp.x, vp.y); ctx.lineTo(q.x, q.y); ctx.stroke(); ctx.setLineDash([]);
    }
    const n = focusV.route.length;
    focusV.route.forEach((w, i) => {
      const st = list.find(s => s.Name === w.name); if (!st) return;
      const tag = focusDrone ? (i === 0 ? "Home" : "Paired") : `Stop ${i + 1}/${n}`;
      drawStopHighlight(st, color, tag, w.name === focusV.nextStop, now);
    });
  }

  const vs = onMap(), focus = hoverId || followId;
  vs.sort((a, b) => (a.id === focus) - (b.id === focus));   // focused one on top
  for (const v of vs) {
    const m = motion.get(v.id); if (!m) continue;
    const c = interp(m, now), p = toScreen(c), isF = v.id === focus;
    ctx.globalAlpha = focus && !isF ? 0.35 : 1;
    if (isF) {
      const pulse = (now % 1200) / 1200;
      ctx.strokeStyle = `rgba(250,149,73,${1 - pulse})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, 14 + pulse * 22, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "#fa9549";
      ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI * 2); ctx.stroke();
    }
    drawMarker(v, p, c.rot, isF);
    if (isF) {
      const cg = cargoText(v);
      const label = `${v.type} ${shortId(v.id)} · ${STATUS_LABEL[v.status]}${v.speed ? ` ${v.speed.toFixed(0)} km/h` : ""}${v.nextStop ? " → " + v.nextStop : ""}${cg ? " · " + cg : ""}`;
      ctx.font = "600 12px Segoe UI, sans-serif"; ctx.textBaseline = "middle";
      const w = ctx.measureText(label).width;
      ctx.fillStyle = "rgba(13,16,19,.9)"; ctx.fillRect(p.x + 20, p.y - 28, w + 12, 20);
      ctx.strokeStyle = "#fa9549"; ctx.lineWidth = 1; ctx.strokeRect(p.x + 20, p.y - 28, w + 12, 20);
      ctx.fillStyle = "#fff"; ctx.fillText(label, p.x + 26, p.y - 18);
    }
    ctx.globalAlpha = 1;
  }
}

// ---- cut-off text ------------------------------------------------------------------
// Any text shortened with "…" (table cells and headers, bar labels, tiles, phase names) shows in full on hover.
// The Vehicles table and the Production machine rows have their own richer hover popups, so they're skipped.
const CLIPPABLE = "table.dt td, table.dt th, tr.sort-row th, .hb-label, .t-sub, .t-label, .step span, .glist .g-name, .lc-legend span";
document.addEventListener("mousemove", e => {
  if (e.target.closest("#tbody, #pMachines tbody, canvas, .popover, .cargo-pop")) return;
  const el = e.target.closest(CLIPPABLE);
  const clipped = el && (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1);
  if (clipped && el.textContent.trim()) {
    cargoPop.innerHTML = `<div class="row"><span>${esc(el.textContent.replace(/\s+/g, " ").trim())}</span></div>`;
    cargoPop.dataset.clip = "1"; showPopAt(cargoPop.innerHTML, e.clientX, e.clientY);
  } else if (cargoPop.dataset.clip) { cargoPop.dataset.clip = ""; hideCargoPop(); }
});

// ---- expand any panel to full screen ------------------------------------------------
// Every panel (cards, the Vehicles table and map) gets a button in its top-right corner that makes it fill the
// window over a dimmed page; the same button (or Esc) puts it back. Maps, charts and tables follow the new size.
const XP_ICON = { open: '<svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
                  close: '<svg viewBox="0 0 16 16" width="14" height="14"><path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>' };
function addExpanders() {
  for (const el of document.querySelectorAll("main.tab .card, .vt-table, .map-col")) {
    if (el.querySelector(":scope > .xp-btn")) continue;
    el.classList.add("has-xp");
    const b = document.createElement("button");
    b.className = "xp-btn"; b.type = "button"; b.title = "Expand to full screen"; b.innerHTML = XP_ICON.open;
    el.prepend(b);
  }
}
function setExpanded(el) {
  const cur = document.querySelector(".xp-on");
  if (cur) { cur.classList.remove("xp-on"); const b = cur.querySelector(":scope > .xp-btn"); b.innerHTML = XP_ICON.open; b.title = "Expand to full screen"; }
  document.body.classList.toggle("xp-open", !!el && el !== cur);
  if (!el || el === cur) return;
  el.classList.add("xp-on");
  const b = el.querySelector(":scope > .xp-btn"); b.innerHTML = XP_ICON.close; b.title = "Back to normal size (Esc)";
}
document.addEventListener("click", e => {
  const b = e.target.closest(".xp-btn"); if (!b) return;
  e.preventDefault(); e.stopPropagation();   // Overview cards are links: don't navigate
  setExpanded(b.parentElement);
}, true);
addEventListener("keydown", e => { if (e.key === "Escape" && document.querySelector(".xp-on")) setExpanded(null); });

// ---- tabs -----------------------------------------------------------------------
// #overview / #vehicles / #production / #power / #progression in the URL, so a tab can be bookmarked; the last one is remembered
const TABS = { overview: "Overview", vehicles: "Vehicles", production: "Production", power: "Power", logistics: "Logistics", progression: "Progression" };
let activeTab = (() => {
  const h = location.hash.slice(1); if (TABS[h]) return h;
  try { const t = localStorage.getItem("ft.tab"); return TABS[t] ? t : "overview"; } catch { return "overview"; }
})();
function setConn(ok, msg) {
  $("dot").className = ok ? "dot ok" : "dot bad";
  $("conn").textContent = ok ? "live · " + new Date().toLocaleTimeString() : "offline: " + msg;
}
// header height, for tabs laid out to fit one screen (CSS var --hdr)
const setHdr = () => document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
new ResizeObserver(setHdr).observe(document.querySelector("header"));   // stats can wrap the header
function showTab(tab) {
  if (!TABS[tab]) tab = "overview";
  activeTab = tab;
  try { localStorage.setItem("ft.tab", tab); } catch {}
  if (location.hash.slice(1) !== tab) window.history.replaceState(null, "", "#" + tab);
  document.title = `${TABS[tab]} · FICSIT Monitor`;
  for (const b of $("tabs").children) b.classList.toggle("on", b.dataset.tab === tab);
  for (const m of document.querySelectorAll("main.tab")) m.hidden = m.id !== "tab-" + tab;
  for (const s of document.querySelectorAll(".stats[data-for]")) s.hidden = s.dataset.for !== tab;
  setHdr();
  $("banner").hidden = tab !== "vehicles";
  hideCargoPop(); closePopover();
  const mods = { overview: Overview, production: Production, power: Power, logistics: LogisticsTab, progression: Progression };
  setExpanded(null);   // leaving a tab closes any full-screen panel
  for (const [k, m] of Object.entries(mods)) k === tab ? m.show() : m.hide();
  addExpanders();
  if (tab === "vehicles") { resize(); poll(); }
}
$("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });
addEventListener("hashchange", () => showTab(location.hash.slice(1)));

// ---- boot -----------------------------------------------------------------------
resize(); fitWorld(); renderHead(); renderLayerButtons(); applyRowHeight();
pollStatic().then(poll);
setInterval(poll, POLL_MS);
setInterval(pollStatic, 60000);
// station contents change constantly; refresh them faster than paths/rails
setInterval(async () => {
  const [ts, rs] = await Promise.allSettled([getJSON("getTruckStation"), getJSON("getTrainStation")]);
  if (ts.status === "fulfilled") truckStations = ts.value;
  if (rs.status === "fulfilled") trainStations = rs.value;
}, 3000);
</script>

<script src="/js/power.js"></script>
<script src="/js/progression.js"></script>
